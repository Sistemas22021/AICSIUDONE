# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.equipo-verde.yml
#
# Levanta el micro-frontend del Equipo Verde:
#   - equipo-verde-web (Módulo de Análisis Forense Holístico)
#
# Este archivo EXTIENDE docker-compose.common.yml.
# Usar el siguiente comando para levantar TODO el ecosistema:
#
#   docker compose \
#     -f docker/docker-compose.common.yml \
#     -f docker/docker-compose.equipo-verde.yml \
#     up --build
#
# Para bajar todo:
#   docker compose \
#     -f docker/docker-compose.common.yml \
#     -f docker/docker-compose.equipo-verde.yml \
#     down
# ─────────────────────────────────────────────────────────────────────────────

include:
  - docker-compose.common.yml

services:
  equipo-verde-web:
    build: ../teams/main/equipo-verde/frontend/equipo-verde-web
    ports:
      - "3002:80"
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:8090
      - VITE_LOGIN_MFE_URL=http://localhost:3000
    networks:
      - sso-network

  balistic-services:
    build: ../teams/main/equipo-verde/backend/balistic-services
    container_name: ev-balistic-services
    ports:
      - "8085:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SSO_AUTH_JWT_SECRET=${JWT_SECRET:-este-es-un-secreto-de-desarrollo-cambiar-en-produccion-32chars}
      - DB_URL_BALISTIC=${DB_URL_BALISTIC:-jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:6543/postgres?pgbouncer=true&prepareThreshold=0}
      - DB_USER_BALISTIC=${DB_USER_BALISTIC:-postgres.nknbplmujgwjsjusqrux}
      - DB_PASSWORD_BALISTIC=${DB_PASSWORD_BALISTIC:-Verde2026**dev}
      - AWS_S3_ENDPOINT=http://localstack:4566
      - STORAGE_TYPE=s3
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - sso-network
