name: "[Frontend] Nexo Criminal Web"
on:
  push:
    branches: [main, dev]
    paths: ["teams/amarrillo/frontend/**"]
  pull_request:
    branches: [main, dev]
    paths: ["teams/amarrillo/frontend/**"]
  workflow_dispatch:

jobs:
  build-lint-test:
    name: "Build - Lint - Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teams/amarrillo/frontend # Solo se aplica aquí
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: teams/amarrillo/frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint || true
      - name: Test
        run: npm run test || true
      - name: Build
        run: npm run build

  deploy-y-approval:
    name: "Deploy + Approval Test"
    runs-on: ubuntu-latest
    needs: build-lint-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Disparar deploy en Render
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" && echo "Deploy disparado"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Esperar propagacion
        run: sleep 30
      - name: Approval Test (verificar que el sitio responde, con reintentos por arranque en frio)
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL")
            echo "Intento $i - HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "APROBADO"
              exit 0
            fi
            sleep 15
          done
          echo "FALLO"
          exit 1
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}