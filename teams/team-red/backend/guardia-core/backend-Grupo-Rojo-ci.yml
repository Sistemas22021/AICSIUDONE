name: Power Ranger Red - Backend CI

on:
  push:
    paths:
      - 'teams/team-red/backend/guardia-core/**'
    branches-ignore:
      - main
  pull_request:
    paths:
      - 'teams/team-red/backend/guardia-core/**'
    branches:
      - main

jobs:
  pruebas-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # `verify` (en vez de `package`) es indispensable: es la fase que ejecuta
      # el goal `jacoco:check` configurado en el pom.xml. Con `package` los tests
      # corren pero el gate de cobertura del 80% nunca se evalúa y el build nunca
      # falla por baja cobertura.
      - name: Compilar, probar y verificar cobertura (mínimo 80%) - Módulo Ranger Red
        run: mvn clean verify
        working-directory: ./teams/team-red/backend/guardia-core

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-ranger-red
          path: teams/team-red/backend/guardia-core/target/surefire-reports/
          retention-days: 14

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-ranger-red
          path: teams/team-red/backend/guardia-core/target/site/jacoco/
          retention-days: 14
